# Throwaway spike for stage-4 task 5. Deliberately its OWN workspace so it
# cannot touch rust/Cargo.lock or the 619-test baseline. Delete the directory
# and the main workspace is untouched.
[package]
name = "vfs-node-spike"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The only vfs crate a host is supposed to name (spec §8b / task 4 report).
# Depending on it here is also the dependency-footprint experiment.
vfs-embed = { path = "../rust/crates/vfs-embed" }
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"

[profile.release]
# Match the main workspace: napi-rs converts panics with catch_unwind, which
# is a no-op under panic = "abort" (spec §9).
panic = "unwind"

[workspace]
members = ["cache-cost"]
