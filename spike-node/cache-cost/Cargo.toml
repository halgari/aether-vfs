# Pure-Rust control for the `cached` finding: no Node, no N-API, no JS. If the
# collapse at a 1 MiB block size reproduces here, it is a property of
# `vfs-cache`, not of the host-language boundary.
[package]
name = "cache-cost"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
vfs-embed = { path = "../../rust/crates/vfs-embed" }
