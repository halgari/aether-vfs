name: ci
on:
  push:
  pull_request:
jobs:
  rust-windows:
    runs-on: windows-latest
    # A runner's default TMP sits under `C:\Users\RUNNER~1\AppData\Local\Temp`:
    # the account is `runneradmin`, which exceeds eight characters, so the
    # profile directory carries an 8.3 alias and **every path derived from
    # `std::env::temp_dir()` carries it too**. Eleven tests failed for that
    # reason alone — `vfs-redirect`'s two 8.3 unit tests plus nine daemon
    # e2e tests (since moved to `vfs-embed`) — while passing on any developer
    # machine whose user name happens to fit in 8.3, which is why it went
    # unnoticed for weeks.
    #
    # The defect those tests trip over is real but shallow in practice: a root
    # *declared* in short form matches short paths and nothing else, including
    # its own long-form paths. It does not arise in production, because a
    # launcher's paths come from Steam config, the registry or a file picker,
    # all long-form.
    #
    # Fixing it in `RootMap` was tried and reverted — `vfs-shim` derives overlay
    # paths and seal decisions from the root's *as-declared* spelling, so
    # expanding it in the map desynchronises the two views. Measured under a
    # short-spelled TMP, that took the suite from 271 passed / 11 failed to
    # 250 passed / 33 failed, the new failures landing in copy-up, write seals
    # and junction sealing. See the `#[ignore]`d
    # `a_root_declared_in_8dot3_form_recognises_its_long_form_paths` in
    # `vfs-redirect/src/lib.rs`, which records the measurement so the next
    # person to reach for that one-line fix finds out it has been tried.
    #
    # So the runner's TMP is what gets corrected, not the product. `vfstmp` is
    # six characters, so Windows generates no 8.3 alias for it and nothing
    # derived from it can carry one.
    #
    # Note this does NOT help a developer whose own Windows user name exceeds
    # eight characters — they still see those eleven failures locally. The real
    # two-layer fix is the answer there.
    env:
      TMP: C:\vfstmp
      TEMP: C:\vfstmp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # `TMP`/`TEMP` above only name the directory; nothing creates it, and code
      # that writes straight into `temp_dir()` without a `create_dir_all` first
      # would fail on a path that does not exist.
      - name: Create an 8.3-free TMP
        run: New-Item -ItemType Directory -Force -Path C:\vfstmp | Out-Null
        shell: pwsh
      # The gate this project actually enforces by hand, made automatic. It was
      # absent while `cargo clippy --all-targets -- -D warnings` was a standing
      # requirement in every task brief — i.e. the standard was upheld only by
      # whoever remembered to type it. `--all-targets` matters: it is what covers
      # tests, benches and the cdylibs.
      - name: Clippy (workspace, all targets, warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: rust
      - name: Build inject artifacts
        # Ensure shim/payload/fixtures sit next to the test profile so
        # vfs-embed's e2e tests can inject them without a nested cargo build. The fixture
        # list must stay in step with `ensure_inject_artifacts`'s `needed`
        # array in crates/vfs-embed/tests/support/artifacts.rs — that is the code that
        # decides which artifacts have to be present, and it re-runs cargo
        # itself for anything missing or stale.
        #
        # `vfs-fixture-vproxy` is not in that array and is not optional either:
        # it is the one entry here needed at **compile** time rather than test
        # time. `vfs-fixture-staticimp` links `vproxy.dll.lib` through a
        # `rustc-link-lib` in its build.rs and deliberately has no Cargo
        # dependency on the cdylib that produces it (a cdylib that is also a
        # path dependency builds twice and collides — cargo#6313, see that
        # crate's Cargo.toml). No Cargo edge means no ordering, so on a clean
        # target dir `cargo test` reaches the link with the import lib absent
        # and fails LNK1181. A developer tree hides this: the lib is already
        # there from an earlier build. Nothing downstream can self-heal it the
        # way `needed` does, because the failure is in the outer compile.
        run: cargo build -p vfs-inject -p vfs-shim-dll -p vfs-fixture-read -p vfs-fixture-writepath -p vfs-fixture-escape -p vfs-fixture-prefs -p vfs-fixture-vproxy -p vfs-bench
        working-directory: rust
      # `--no-fail-fast` is not optional here. Without it cargo stops after the
      # first test binary that fails, and this suite is 689 tests across 116
      # binaries — so a single failing daemon e2e test truncated the run
      # at 274 tests and reported "7 failed" when the real total was unknown.
      # A red run that hides most of the suite is barely better than no run: it
      # tells you something broke without telling you how much.
      #
      # This was discovered the first time this step ever got as far as *running*
      # tests. Until the `vproxy.dll.lib` link ordering was fixed, it failed at
      # compile on every push, so the truncation had never been observable.
      #
      # This command takes no `-p` flags: it is an unfiltered workspace run, so
      # every member (vfs-proton included) is covered, shim tests among them.
      - name: Rust tests (full engine — includes Windows-only crates)
        run: cargo test --no-fail-fast
        working-directory: rust

  rust-linux-portable:
    runs-on: ubuntu-latest
    env:
      # Every crate that builds on Linux. The rest (vfs-shim, vfs-shim-dll,
      # vfs-inject, vfs-win, vfs-fixture-*) pull Windows-only code (`retour`,
      # Win32) and are linted and tested by the Windows job; vfs-redirect is
      # portable and is listed here.
      LINUX_CRATES: >-
        -p vfs-ipc -p vfs-protocol -p vfs-provider -p vfs-compose -p vfs-pe
        -p vfs-zip -p vfs-core -p vfs-env -p vfs-unix -p vfs-proton
        -p vfs-embed -p vfs-director -p vfs-registry -p vfs-testkit -p vfs-bench
        -p vfs-ntlayout -p vfs-redirect
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # One style for the workspace, set in rust/rustfmt.toml.
      - name: Format (cargo fmt --check)
        run: cargo fmt --all --check
        working-directory: rust
      # The Windows job lints the workspace on a Windows target; this lints the
      # `#[cfg(unix)]` half (Proton launch, vfs-unix, the unix side of
      # vfs-director, the `proton_*` tests) that nothing else compiles.
      - name: Clippy (Linux crates, all targets, warnings are errors)
        run: cargo clippy $LINUX_CRATES --all-targets -- -D warnings
        working-directory: rust
      # `vfs-core` and `vfs-env` were portable before anyone
      # claimed it: measured 2026-09-01 in a WSL Arch box on an ext4
      # checkout, they contribute passing tests with a Linux dependency graph
      # containing no windows crate at all. The ring transport is proven on
      # Linux, not merely compiled, by `vfs-director/tests/serve_file_backed.rs`
      # and the `vfs-ipc` tests, which drive the control ring end-to-end.
      #
      # `vfs-proton` is the newest entry and the only one that is portable *on
      # purpose* rather than by nature: extracting a Linux Proton tarball on
      # Windows produces nothing anyone can run, and it stays in both jobs
      # anyway so that its URL building, digest parsing, version ordering and
      # layout logic are covered by the thicker Windows job too. Linux is where
      # it is actually used, so it is listed here explicitly.
      #
      # **No test in `vfs-proton` touches the network.** The real GE-Proton
      # tarball is 533,700,853 bytes and a CI job that downloads it would be
      # unacceptable. Release resolution is tested against fixture JSON;
      # download/verify/extract is tested end-to-end against a `TcpListener` on
      # `127.0.0.1:0` serving a few hundred bytes the test itself built
      # (`tests/loopback_install.rs`) — loopback, ephemeral port, no name
      # resolution, no route off the machine. The one real download belongs to
      # the `proton-linux` job below, pinned and cached rather than per run.
      #
      # `vfs-testkit`, `vfs-bench` and `vfs-ntlayout` are portable and carry
      # their own tests.
      #
      # `vfs-embed` is here because `Session::serve`/`launch` have a unix
      # implementation (the file-backed ring and the Proton launch) whose
      # non-ignored tests run on any Linux box; its Wine tests are
      # `#[ignore]`d and run by `proton-linux`.
      - name: Portable Rust crates (compile+test on Linux)
        run: cargo test --no-fail-fast $LINUX_CRATES
        working-directory: rust
      # Doc build: warn-only for now. rustdoc reports about 35 broken or
      # private intra-doc links across vfs-embed, vfs-ipc, vfs-redirect,
      # vfs-director, vfs-proton and others (plus one in generated prost
      # code). Clear them, then drop `continue-on-error` and add
      # `RUSTDOCFLAGS: -D warnings`.
      - name: Docs (cargo doc --no-deps, warn-only)
        run: cargo doc --no-deps $LINUX_CRATES
        working-directory: rust
        continue-on-error: true

  # The Proton path end to end, on Linux: the shim is always a Windows PE,
  # injected into a Windows program inside GE-Proton's Wine, while the Director
  # serving it is native Linux. So this job cross-builds the Windows half
  # (`bin/build-windows`, MSVC target via cargo-xwin — the same ABI and link
  # flags the Windows jobs use), then runs the `#[ignore]`d
  # `proton_launch` and `proton_registry` tests, whose fixture reads a file that exists only in the
  # Linux Director's provider.
  proton-linux:
    runs-on: ubuntu-latest
    env:
      # Pinned, not "newest": a new GE release is a new Wine, and the export set
      # the shim hooks is an observation about a release, not a guarantee (spec
      # 2026-09-01 §10). Bump deliberately, and the cache key with it.
      GE_PROTON: GE-Proton11-7
      VFS_HOME: ${{ github.workspace }}/.vfs-home
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin
      # clang-cl, lld-link and llvm-lib for cargo-xwin. The 32-bit loader is for
      # Wine: its launcher probes it even under WINEARCH=win64, and wineboot
      # fails with `/lib/ld-linux.so.2: could not open` without it.
      - name: Install cross + Wine prerequisites
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm libc6:i386 libgcc-s1:i386
      # The MSVC CRT + Windows SDK cargo-xwin downloads on first use.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-v1
      - uses: actions/cache@v4
        with:
          path: .vfs-home/runtimes
          key: ${{ env.GE_PROTON }}-v1
      - name: Cross-build the Windows artifacts
        run: bin/build-windows
      # A no-op on a cache hit: install skips a tag that is already present and
      # verified. On a miss it downloads ~537 MiB and checks the published
      # sha512 before extracting.
      #
      # The token matters on a miss: resolving the tag lists releases through
      # api.github.com, whose unauthenticated limit (60/hour per IP) a shared
      # runner routinely exhausts with a 403. It is sent only to that listing.
      # Caches are per-branch (a PR branch's cache is invisible to master), so
      # a miss is the first run on each branch, not a rare event.
      - name: Install GE-Proton
        run: cargo run -q -p vfs-proton -- install --version "$GE_PROTON"
        env:
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: rust
      - name: Proton end-to-end (Windows fixture under Wine, Linux Director)
        run: timeout 900 cargo test -p vfs-embed --test proton_launch -- --ignored --nocapture
        working-directory: rust
        # A missing runtime or artefact is a failure here, not a SKIP.
        env:
          VFS_TEST_REQUIRE_ALL: "1"
      # The registry overlay end to end: the scripted Win32 registry sequence
      # must give the same transcript with and without the overlay. Same
      # runtime and (debug) artefacts as above.
      - name: Registry overlay end-to-end (Windows fixture under Wine)
        run: timeout 900 cargo test -p vfs-embed --test proton_registry -- --ignored --nocapture
        working-directory: rust
        env:
          VFS_TEST_REQUIRE_ALL: "1"

  # The add-ons workspace (addons/): optional crates on top of the core. Its own
  # job, so the core's build never sees them.
  addons:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addons
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: addons
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --workspace --all-features
      # Feature-gated code the default run compiles out: the storage crate's
      # test hooks and the block store's abort-at-crash-point hooks that its
      # subprocess crash tests drive.
      - name: Feature-gated tests (test-hooks, crash-points)
        run: |
          cargo test -p aether-storage --features test-hooks
          cargo test -p aether-block-store --features crash-points
          cargo clippy -p aether-storage --features test-hooks --all-targets -- -D warnings
      # The block store's own gates, carried over from its repository:
      # `crash-points` compiles in the abort hooks its subprocess crash tests
      # drive (off by default, so the plain run above skips them), and the
      # model test runs 512 proptest cases in release, where it is fast
      # enough to be worth the depth.
      - name: Block store (all features, clippy, deep model test)
        run: |
          cargo clippy -p aether-block-store --all-targets --all-features -- -D warnings
          cargo test -p aether-block-store --all-features
          cargo test -p aether-block-store --release --test model
          cargo bench -p aether-block-store --no-run
        env:
          PROPTEST_CASES: "512"
