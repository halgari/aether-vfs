name: ci
on:
  push:
  pull_request:
jobs:
  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build daemon + inject artifacts
        # Ensure shim/payload/fixture sit next to the test profile so the
        # daemon e2e can inject vfs-fixture-read without a nested cargo build.
        run: cargo build -p vfs-directord -p vfs-source -p vfs-inject -p vfs-shim-dll -p vfs-payload -p vfs-fixture-read -p vfs-fixture-write -p vfs-fixture-writeset -p vfs-ring-harness
        working-directory: rust
      - name: Rust tests (full engine — includes Windows-only crates)
        run: cargo test
        working-directory: rust

  rust-linux-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Portable Rust crates (compile+test on Linux)
        run: cargo test -p vfs-ipc -p vfs-protocol -p vfs-compose -p vfs-cache -p xtask-descriptor
        working-directory: rust
      - name: Regenerate protocol artifacts
        run: bin/regen-protocol
      - name: Fail on protocol drift
        run: git diff --exit-code resources/
