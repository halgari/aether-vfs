name: ci
on:
  push:
  pull_request:
jobs:
  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # The gate this project actually enforces by hand, made automatic. It was
      # absent while `cargo clippy --all-targets -- -D warnings` was a standing
      # requirement in every task brief — i.e. the standard was upheld only by
      # whoever remembered to type it. `--all-targets` matters: it is what covers
      # tests, benches and the `vfs-node` cdylib.
      - name: Clippy (workspace, all targets, warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: rust
      - name: Build daemon + inject artifacts
        # Ensure shim/payload/fixtures sit next to the test profile so the
        # daemon e2e can inject them without a nested cargo build. The fixture
        # list must stay in step with `ensure_inject_artifacts`'s `needed`
        # array in crates/vfs-directord/tests/e2e.rs — that is the code that
        # decides which artifacts have to be present, and it re-runs cargo
        # itself for anything missing or stale.
        run: cargo build -p vfs-directord -p vfs-source -p vfs-inject -p vfs-shim-dll -p vfs-fixture-read -p vfs-fixture-writepath -p vfs-fixture-escape -p vfs-ring-harness
        working-directory: rust
      - name: Build vfs-payload (separate workspace)
        working-directory: rust
        run: cargo build --manifest-path crates/vfs-payload/Cargo.toml
        env:
          CARGO_TARGET_DIR: target
      - name: Rust tests (full engine — includes Windows-only crates)
        run: cargo test
        working-directory: rust

  # The `aethervfs` addon and its JavaScript suites — stage 4's gate.
  #
  # Nothing here was covered before. `cargo build --workspace --tests` filters
  # cdylibs, so the addon's own Rust was never built by CI; `[lib] test = false`
  # keeps `cargo test` away from it; and ~2,500 lines of JS tests plus the
  # conformance gate itself were verified only by a human typing `npm test`. A
  # gate nobody runs is not a gate, and this repository has already had CI
  # silently disabled once by a deletion sweep that covered source and not
  # workflows.
  node-addon-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          # Three floors, and this is the highest of them — `package.json`'s
          # `engines` says the same number, so keep the two in step:
          #   18    load the addon (N-API 8)
          #   22.6  run an `.mts` file directly (type stripping) — which is how the
          #         examples, the provider fixtures and the worker entry point are
          #         loaded, all of them `.mts` as of the ESM migration
          #   24    the `using` declarations in `test/dispose.test.mts`
          #         (Explicit Resource Management syntax)
          node-version: '24'
      # The package gained **devDependencies** in the TypeScript migration —
      # typescript, @types/node, vitest — and still no runtime dependency. The
      # install is needed before the build, because the build now begins with
      # `tsc`. `--frozen-lockfile` is what makes `pnpm-lock.yaml` load-bearing:
      # a lockfile nobody freezes is a lockfile that drifts.
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Install (frozen lockfile, dev dependencies only exist here)
        run: pnpm install --frozen-lockfile
        working-directory: rust/crates/vfs-node
      # `pnpm build` is the only correct way to build this package: `tsc -p
      # tsconfig.build.json` (the JavaScript layer and its declaration), then
      # four unfiltered cargo invocations (the addon cdylib, the shim cdylib, the
      # separate-workspace payload, and the probe exe) followed by four copies
      # into the package directory. It also prints each artifact's size and
      # mtime, which is how a stale DLL gets noticed.
      #
      # It has to run before anything below: `index.mjs` and `index.d.mts` are
      # build outputs as of task 2 and are not in the repository.
      - name: Build the JavaScript layer, the addon and its DLLs
        run: pnpm build
        working-directory: rust/crates/vfs-node
      # `index.d.mts` is emitted, but `native.mts` — the addon's own `#[napi]`
      # surface — is still hand-written, because the thing that could generate it
      # (`@napi-rs/cli`) is a network dependency in the build path. Nothing else
      # checks it: a `#[napi]` export renamed, added or dropped on the Rust side
      # is invisible to `tsc`. This is the check that sees it, and it is the same
      # class of defect as `Session.readdir` and `Session.getattr` having been
      # missing from the declaration entirely — which no type checker can notice,
      # because nothing references what does not exist. `tsc --noEmit` below is a
      # separate gate that complements it.
      - name: Check the declaration against the addon's real exports
        run: node scripts/check-types.mts
        working-directory: rust/crates/vfs-node
      # Typechecks **the whole package**, `test/**` and `examples/**` included as
      # of task 3. Until then `include` stopped at the package's own sources,
      # because `require(...) as typeof import(...)` in the suites produced
      # 134 × TS2775 on `assert.ok` — a cast is not the explicit annotation an
      # assertion function needs. The conversion replaced the idiom and widened the
      # scope, and this step going green over the wider scope is the check that it
      # landed.
      - name: Typecheck
        run: pnpm exec tsc --noEmit
        working-directory: rust/crates/vfs-node
      # The examples are tests: each one asserts its way through a full session,
      # and `spec-8-example.mts` machine-checks spec §8's provider graph rather
      # than describing it. All three are `.mts`, run directly by node.
      - name: Examples (vertical slice, JS provider, spec §8)
        run: node examples/vertical-slice.mts && node examples/js-provider.mts && node examples/spec-8-example.mts
        working-directory: rust/crates/vfs-node
      # vitest, not `node --test`: task 3 converted the five suites to vitest's own
      # API and deleted the `node:test` shim that had been mapping one onto the
      # other. `vitest.config.ts` pins `pool: 'forks'`, which is what keeps the
      # deadlock guard's owning-thread comparison meaning what it meant under
      # `node --test`.
      #
      # One test is a **`test.fails`** and must stay failing: `primitives.test.mts`'s
      # "6b. a capitalised path in memory()" pins spec §6b's `casefold` hole, which
      # is the first item of the next stage. `test.fails` is stricter than the
      # `node --test` `todo` it replaced — node tolerated a todo that passed, while
      # this turns the run **red** the day the hole closes, so it cannot close
      # without anyone noticing.
      - name: JS suites (vitest)
        run: pnpm exec vitest run
        working-directory: rust/crates/vfs-node
      # The performance gate. Its own step rather than part of `pnpm test`,
      # because that chain is already build + typecheck + drift + three
      # injected-process examples + vitest, and timing assertions get noisier the
      # longer and more contended the run.
      #
      # It builds **release** itself and then refuses to run unless
      # `aethervfs.node` is byte-identical to `target/release` — so unlike the
      # `vfs-cache` cost tests, it cannot quietly report debug numbers (see the
      # correction in rust/docs/benchmarks/README.md).
      #
      # Assertions are tiered so a 4-vCPU runner cannot flake them: tier 1 is
      # deterministic counters (crossing counts, cache hits) and load cannot move
      # it; tiers 2 and 3 are ratios and absolute ceilings with multiples of
      # headroom, never snug against an observed number. If a tier-3 ceiling ever
      # does flake here, raise it and say why — do not delete the step.
      - name: Benchmarks (performance gate)
        run: pnpm bench
        working-directory: rust/crates/vfs-node

  rust-linux-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Portable Rust crates (compile+test on Linux)
        run: cargo test -p vfs-ipc -p vfs-protocol -p vfs-provider -p vfs-compose -p vfs-cache -p xtask-descriptor
        working-directory: rust
      - name: Regenerate protocol artifacts
        run: bin/regen-protocol
      - name: Fail on protocol drift
        run: git diff --exit-code resources/
