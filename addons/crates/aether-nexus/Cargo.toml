[package]
name = "aether-nexus"
description = "Nexus Mods: the v3 API (file records, signed repacked-zip links, quota) and random access into repacked zips"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
## `provider::ArchiveProvider`: a repacked zip as a read-only
## `vfs_provider::Provider` tree.
provider = ["dep:vfs-core", "dep:vfs-provider"]

[dependencies]
aether-archive.workspace = true
aether-net.workspace = true
futures-util = { workspace = true, features = ["std"] }
humantime.workspace = true
reqwest.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
url.workspace = true
vfs-core = { workspace = true, optional = true }
vfs-provider = { workspace = true, optional = true }

[dev-dependencies]
axum = { workspace = true, features = ["http1", "tokio"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["net"] }
vfs-provider = { workspace = true, features = ["conformance"] }
xxhash-rust = { workspace = true, features = ["xxh64"] }
zstd.workspace = true
