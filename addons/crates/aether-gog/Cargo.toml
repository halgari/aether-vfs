[package]
name = "aether-gog"
description = "GOG Galaxy content-system v2 access: OAuth login, builds, depot manifests cached on disk, random-access reads from the GOG CDN"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
## `provider::DepotProvider`: depot manifests as a read-only
## `vfs_provider::Provider` tree.
provider = ["dep:vfs-provider"]

[dependencies]
aether-archive.workspace = true
aether-net.workspace = true
bytes.workspace = true
flate2.workspace = true
futures-util = { workspace = true, features = ["std"] }
md-5 = "0.11"
reqwest = { workspace = true, features = ["http2", "rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing.workspace = true
url.workspace = true
vfs-provider = { workspace = true, optional = true }
zeroize.workspace = true

[dev-dependencies]
axum = { workspace = true, features = ["http1", "tokio", "query"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros"] }
vfs-provider = { workspace = true, features = ["conformance"] }

[[test]]
name = "provider"
required-features = ["provider"]
