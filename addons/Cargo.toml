# The add-ons: optional crates on top of the core in ../rust. The core never
# depends on anything here. See docs/superpowers/specs/2026-10-08-addons-design.md.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.96"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[workspace.dependencies]
# Core crates, by path.
vfs-core = { path = "../rust/crates/vfs-core" }
vfs-provider = { path = "../rust/crates/vfs-provider" }
vfs-compose = { path = "../rust/crates/vfs-compose" }
vfs-embed = { path = "../rust/crates/vfs-embed", default-features = false }
vfs-testkit = { path = "../rust/crates/vfs-testkit" }
vfs-proton = { path = "../rust/crates/vfs-proton", default-features = false }

# Add-on crates.
aether-archive = { path = "crates/aether-archive" }
aether-block-store = { path = "crates/aether-block-store" }
aether-net = { path = "crates/aether-net" }
aether-nexus = { path = "crates/aether-nexus" }
aether-steam = { path = "crates/aether-steam" }
aether-storage = { path = "crates/aether-storage" }
aether-wj-cdn = { path = "crates/aether-wj-cdn" }

# Shared external crates: one version spec each, as in the core workspace.
# Members add their own `features` / `optional` on top.
axum = { version = "0.8.9", default-features = false }
base64 = "0.23.1"
blake3 = "1.8"
bytes = "1"
flate2 = "1.1.10"
futures-util = { version = "0.3.34", default-features = false }
http = "1.5"
humantime = "2.4.0"
postcard = "1.1.3"
proptest = "1.11"
prost = "0.14"
qrcode = { version = "0.14", default-features = false }
redb = "4.3"
reqwest = { version = "0.13.5", default-features = false }
rpassword = "7"
serde = "1"
serde_json = "1"
sevenz-rust2 = { version = "0.23.0", default-features = false }
sha1_smol = "1.0"
steamroom = { git = "https://github.com/landaire/steamroom", rev = "4dd310cb98d94f2acb99ea62d5996284bd080bca", default-features = false }
tempfile = "3.27"
thiserror = "2"
tokio = "1"
toml = "0.8"
tracing = "0.1"
url = "2.5.8"
xxhash-rust = "0.8.19"
zeroize = "1"
zip = { version = "8.6.0", default-features = false }
zstd = "0.14"

[profile.dev]
panic = "unwind"

# Third-party code optimised even in debug builds, as in the core workspace.
[profile.dev.package."*"]
opt-level = 2
