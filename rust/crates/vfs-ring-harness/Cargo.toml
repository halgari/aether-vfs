[package]
name = "vfs-ring-harness"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
vfs-ipc = { path = "../vfs-ipc" }
vfs-protocol = { path = "../vfs-protocol" }

# `ring-bench` is Unix-only: its Windows `main` just exits.
[target.'cfg(unix)'.dependencies]
# `ring-bench` drives the real Director and its serve workers, not a
# hand-written server: the worker loop and its notifier are half of what a
# round trip costs.
vfs-director = { path = "../vfs-director" }
vfs-provider = { path = "../vfs-provider" }
# `ring-bench names`: a base whose names are in a tree (`vfs-compose`) and one
# whose names are in an index (a `vfs-storage` layer), and the shim's own
# final-path code (`vfs-core`).
vfs-compose = { path = "../vfs-compose" }
vfs-storage = { path = "../vfs-storage" }
vfs-core = { path = "../vfs-core" }

# Native on both ends: latency of one requester and throughput of several,
# under the shim's client discipline before and after `ring_lock` went.
[[bin]]
name = "ring-bench"
path = "src/bin/ring-bench.rs"
