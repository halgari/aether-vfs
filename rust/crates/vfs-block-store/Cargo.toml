[package]
name = "vfs-block-store"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Deduplicating, compressing block store for a virtual file system cache"
license = "GPL-3.0-only"
publish = false

[dependencies]
blake3 = "1.8"
rayon = "1.12"
redb = "4.3"
thiserror = "2"
tracing = "0.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = "0.14"
# GPU zstd for bulk writes (feature `gpu-zstd`). Pinned: the crate has no releases (and no
# LICENSE file, so nothing of it is copied here; it is only linked when the feature is on).
gzc-gpu = { git = "https://github.com/halgari/gpu-zstd-comp", rev = "655fb68b77b9ad01cd402817a526c2a2ebf4ace2", optional = true }

[dev-dependencies]
vfs-testkit = { path = "../vfs-testkit" }
criterion = "0.8"
proptest = "1.11"
memory-stats = "1.2"
tempfile = "3.27"

[features]
# Enables crash_point() calls that abort the process when BLOCK_STORE_CRASH_AT matches.
crash-points = []
# Bulk writes (`WriteClass::Bulk`) can be compressed on the GPU (`BulkCompression::Gpu`), through
# `gzc-gpu`. Off by default: without it the store builds and runs with no GPU stack at all.
gpu-zstd = ["dep:gzc-gpu"]

[[bench]]
name = "store"
harness = false

[[example]]
name = "gpu_bench"
required-features = ["gpu-zstd"]
