syntax = "proto3";

package vfs.source;

// Out-of-process source plugin contract (mirrors the vfs-provider Provider trait).
service Source {
  rpc GetCapabilities(Empty) returns (CapsResp);
  rpc GetAttr(GetAttrReq) returns (GetAttrResp);
  rpc ReadDir(ReadDirReq) returns (ReadDirResp);
  rpc Open(OpenReq) returns (OpenResp);
  rpc Read(ReadReq) returns (ReadResp);
  rpc Release(ReleaseReq) returns (Empty);
}

message Empty {}

// 1 = Stage 1 read-only contract. Bumped when the wire shape changes.
message CapsResp {
  uint32 contract_version = 1;
  uint32 access = 2;          // 0 = SeqRead, 1 = Read, 2 = ReadWrite
  bool   immutable = 3;
  bool   slow = 4;
  uint32 preferred_block = 5; // 0 = unset
}

message GetAttrReq { string path = 1; uint32 root = 2; }
message GetAttrResp {
  bool found = 1;
  bool is_dir = 2;
  uint64 size = 3;
  int64 mtime = 4;
  int32 status = 5; // 0 = ok, negative = protocol ST_*
}

message ReadDirReq { string path = 1; uint32 root = 2; }
message DirEnt {
  string name = 1;
  bool is_dir = 2;
  uint64 size = 3;
  int64 mtime = 4;
}
message ReadDirResp {
  repeated DirEnt entries = 1;
  int32 status = 2;
}

message OpenReq {
  string path = 1;
  uint32 flags = 2;
  uint32 root = 3;
}
message OpenResp {
  uint64 handle = 1;
  uint64 size = 2;
  bool is_dir = 3;
  uint64 file_id = 4;
  int32 status = 5;
}

message ReadReq {
  uint64 handle = 1;
  uint64 offset = 2;
  uint32 len = 3;
}
message ReadResp {
  bytes data = 1;
  int32 status = 2;
}

message ReleaseReq { uint64 handle = 1; }
