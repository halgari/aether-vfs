[package]
name = "vfs-source"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Source facade: Provider builders, gRPC SourceService"

[lib]
name = "vfs_source"
path = "src/lib.rs"

[[bin]]
name = "vfs-source-plugin"
path = "src/bin/vfs-source-plugin.rs"

[features]
## Re-export the provider conformance suite (`vfs-provider`'s feature of the
## same name). Off by default; this crate's own tests enable the suite through
## their dev-dependency.
conformance = ["vfs-provider/conformance"]

[dependencies]
vfs-provider.workspace = true
vfs-zip.workspace = true
vfs-control.workspace = true
# `DiskProvider` for `SourceSpec::Disk` and `MemoryProvider` for
# `SourceSpec::Memory`.
vfs-compose.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
prost.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-stream = { workspace = true, features = ["net"] }
clap = { workspace = true, features = ["derive"] }

[build-dependencies]
tonic-prost-build.workspace = true
protoc-bin-vendored.workspace = true

[dev-dependencies]
vfs-testkit.workspace = true
vfs-provider = { workspace = true, features = ["conformance"] }

[lints]
workspace = true
