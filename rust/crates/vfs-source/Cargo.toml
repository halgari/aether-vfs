[package]
name = "vfs-source"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "Source facade: Provider builders, gRPC SourceService"

[lib]
name = "vfs_source"
path = "src/lib.rs"

[[bin]]
name = "vfs-source-plugin"
path = "src/bin/vfs-source-plugin.rs"

[features]
## Re-export the provider conformance suite (`vfs-provider`'s feature of the
## same name). Off by default; this crate's own tests enable the suite through
## their dev-dependency.
conformance = ["vfs-provider/conformance"]

[dependencies]
vfs-provider = { path = "../vfs-provider" }
vfs-zip = { path = "../vfs-zip" }
vfs-control = { path = "../vfs-control" }
# `DiskProvider` for `SourceSpec::Disk` and `MemoryProvider` for
# `SourceSpec::Memory`.
vfs-compose = { path = "../vfs-compose" }
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
clap = { version = "4", features = ["derive"] }

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
vfs-testkit = { path = "../vfs-testkit" }
vfs-provider = { path = "../vfs-provider", features = ["conformance"] }
