[package]
name = "vfs-compose"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "Read-only composition: layered (top-wins) + router (glob routes)"

[lib]
name = "vfs_compose"
path = "src/lib.rs"

[dependencies]
vfs-provider = { path = "../vfs-provider" }
# `fold` only — the single source of truth for case-insensitive comparison.
# The shim folds vpath components with it before they cross the ring, so every
# combinator that keys or compares a name below the ring has to use the same
# function or the two sides disagree on anything Unicode-cased.
vfs-core = { path = "../vfs-core" }

[dev-dependencies]
vfs-testkit = { path = "../vfs-testkit" }
vfs-provider = { path = "../vfs-provider", features = ["conformance"] }
