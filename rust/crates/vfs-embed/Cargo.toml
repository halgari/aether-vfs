[package]
name = "vfs-embed"
version = "0.1.0"
edition = "2021"
publish = false
description = "Public embeddable API: session lifecycle, roots, composition, launch"

[lib]
name = "vfs_embed"
path = "src/lib.rs"

[features]
default = ["zip"]
## Convenience `Session::mount_zip` (pulls vfs-zip). Moved here with `Session`
## itself; `vfs-director` no longer has a `zip` feature.
zip = ["dep:vfs-zip"]

[dependencies]
# The kernel this API is a seam over: `Director`, its ring/IPC server, the
# disk leaf, and the staging helpers. A host never names this crate.
vfs-director = { path = "../vfs-director" }
# The provider contract itself. Re-exported wholesale, because a host that
# writes a provider needs every one of these names and must not have to
# discover which internal crate they live in.
vfs-provider = { path = "../vfs-provider" }
# Combinator primitives (spec §6). `OverlayProvider` is load-bearing here —
# `compose_root` builds a root's writable upper out of it — and the rest are
# re-exported so a host composes a graph without a second dependency.
vfs-compose = { path = "../vfs-compose" }
# The `cached` primitive, re-exported for the same reason: a slow
# host-authored provider is expected to be wrapped in one (spec §8b).
vfs-cache = { path = "../vfs-cache" }
vfs-env = { path = "../vfs-env" }
vfs-zip = { path = "../vfs-zip", optional = true }

# Injection and the NT-hook shim are the Windows delivery mechanism. They are
# gated in the manifest, not with cfg in source: `vfs-shim` pulls `retour` ->
# `libudis86-sys`, whose build script is a C cross-compile that fails for a Linux
# target before any of our code is reached.
[target.'cfg(windows)'.dependencies]
vfs-inject = { path = "../vfs-inject" }
vfs-shim = { path = "../vfs-shim" }

# The Proton (Wine) delivery mechanism: the unix counterpart of the pair above.
# GE-Proton discovery and verification, the per-session Wine prefix, and the
# injector's positional argv plus the shim's file-backed env handshake, all of
# which `Session::launch` drives on unix. Gated in the manifest for symmetry
# with the Windows pair, and because a Windows host has no use for it.
[target.'cfg(unix)'.dependencies]
# `default-features = false` drops its `acquire` feature, and with it
# `ureq` -> `rustls` -> `ring` — a C cross-compile in a build script, which is
# the same reason `vfs-shim` is kept out of the Linux graph above. A host
# embedding this API launches a runtime; it does not download one.
vfs-proton = { path = "../vfs-proton", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# The macOS Wine host. A peer of `vfs-proton`, not a replacement — see
# `src/wine_host.rs`. Narrower than `cfg(unix)` deliberately: a Linux build
# has no CrossOver to find and must not carry a crate that only knows how
# to look for one.
# `acquire` on, unlike this crate's `vfs-proton` line above. That feature is
# off by default in `vfs-crossover` so a workspace build on any host does not
# pull `ureq -> rustls -> ring`; it is wanted *here*, and only here, because
# this dependency edge exists only on macOS — where a fresh Wine prefix has to
# fetch the Visual C++ runtime before a modded game will survive in it.
vfs-crossover = { path = "../vfs-crossover", features = ["acquire"] }
# The portable shim-config encoder (`vfs_protocol::shimcfg`). On Windows the
# same bytes come from `vfs-shim`'s re-export of it; on unix `vfs-shim` cannot
# be built at all (`retour` -> `libudis86-sys`), which is why the encoder moved
# into `vfs-protocol` in the first place. Also a dev-dependency below, for the
# ring codecs — the two entries are the same crate, not two copies.
vfs-protocol = { path = "../vfs-protocol" }

[dev-dependencies]
# `vfs-zip` is optional above (the `zip` feature); tests use `ZipProvider`
# whether or not that feature is on, so it is unconditional here. `vfs-shim`
# is NOT repeated — it is a `cfg(windows)` dependency above, and the one test
# that names it (`zip_serve_integrity::ring_client_reads_are_byte_exact`) is
# `#[cfg(windows)]` to match. Adding it here unconditionally would drag
# `retour` -> `libudis86-sys` into the Linux dev graph, where its build script
# is a C cross-compile that fails before any of our code is reached — the same
# reason the dependency is gated in the first place.
vfs-zip = { path = "../vfs-zip" }
# Ring wire codecs, for the tests that drive a served session over the ring
# the way the injected shim does.
vfs-protocol = { path = "../vfs-protocol" }
