[package]
name = "vfs-ntlayout"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Pure NT byte layouts and decisions (info classes, directory records, dispositions): no OS API, host-testable."

[dependencies]
# `OPEN_*` flag bits that `open_create_flags` maps a disposition onto.
vfs-protocol = { path = "../vfs-protocol" }
