syntax = "proto3";

package vfs.director;

// ── Control-plane service ────────────────────────────────────────────────────
// A per-user daemon holds many sessions. A client creates a session, adds source
// mappings, then launches an executable tied to that session. Read-only phase.
service Director {
  rpc Health(HealthReq) returns (HealthResp);
  rpc CreateSession(CreateSessionReq) returns (Session);
  rpc DeclareRoot(DeclareRootReq) returns (Empty);
  rpc AddSource(AddSourceReq) returns (SourceRef);
  rpc Launch(LaunchReq) returns (stream LaunchEvent);
  rpc TeardownSession(TeardownReq) returns (Empty);
  rpc ListSessions(Empty) returns (SessionList);
  rpc Stats(Empty) returns (StatsResp);
}

message Empty {}

message HealthReq {}
message HealthResp {
  string version = 1;
  uint32 sessions = 2;
}

message CreateSessionReq {
  string name = 1; // optional label
}
message Session {
  string id = 1;
  string name = 2;
  string root = 3; // daemon-chosen virtual root; address files as <root>/<path>
}
message SessionList {
  repeated Session sessions = 1;
}

// A declarative source. Read-only phase wires disk + zip; http/remote reserved.
message SourceSpec {
  oneof kind {
    DiskSource disk = 1;
    ZipSource zip = 2;
    HttpSource http = 3;
    RemoteSource remote = 4;
  }
}
message DiskSource { string path = 1; }
message ZipSource { string path = 1; }
message HttpSource { string url = 1; }
message RemoteSource { string endpoint = 1; }

// Declare which real host directory a non-zero session root virtualizes
// (stage 2b). `AddSourceReq.root` says what a root *serves*; this says where
// the injected process should recognise it, which is a different fact and has
// a different source (a config's `[[root]] path`). Without it a multi-root
// config mounts its providers and the shim never classifies a single path
// into the second root — every one falls through to real disk, silently.
//
// Root 0 is the daemon-chosen `Session.root` and is rejected here rather than
// re-pointed.
message DeclareRootReq {
  string session_id = 1;
  uint32 root = 2;
  string path = 3; // absolute host directory
}

message AddSourceReq {
  string session_id = 1;
  SourceSpec source = 2;
  string mount = 3; // virtual prefix, e.g. "/"
  int32 layer = 4;  // precedence; higher wins on same path
  // Which declared session root this source targets (stage 2b). Defaults to
  // 0, the root every pre-2b client implicitly meant. This is the
  // control-plane RPC, not the ring wire the injected DLL speaks — new
  // fields are safe to add here; never renumber.
  uint32 root = 5;
  // Make this source the root's **write layer** instead of one more sibling
  // layer (gate 4). The write layer sits above the whole graph as an overlay
  // upper, so a write to content only a read-only source holds is copied up
  // into it rather than refused — the in-place edit (`fopen(…, "r+b")`) every
  // mod tool and INI writer does. A sibling layer cannot express that: layer
  // composition can route a write to a source that owns the path, but cannot
  // seed a destination from a lower layer.
  //
  // The provider must declare ReadWrite (a `disk` source; a zip or a remote
  // is rejected), it must mount at the root ("/"), and `layer` is ignored —
  // the write layer is above every layer by construction. At most one per
  // root; a second declaration replaces the first.
  bool write_layer = 6;
}
message SourceRef {
  uint64 id = 1;
}

message LaunchReq {
  string session_id = 1;
  string exec = 2;            // image path under the virtual root
  repeated string args = 3;
  bool wait = 4;
  reserved 5;                 // was hollow_pe; the staged launch has no hollow
  reserved "hollow_pe";
  map<string, string> env = 6; // per-child environment (must not leak to the daemon)
}
message LaunchEvent {
  oneof event {
    Started started = 1;
    Exited exited = 2;
    LogLine log = 3;
  }
}
message Started { uint32 pid = 1; }
message Exited { int32 code = 1; }
message LogLine { string line = 1; }

message TeardownReq {
  string session_id = 1;
}

// A write refused because the resolved mount had no `ReadWrite` provider,
// keyed by path with a running count (`io_stats::rejected_writes`).
message RejectedWrite {
  string path = 1;
  uint64 count = 2;
}

// Block-cache metrics (M2). Fields 9+ (measurement gate) are the
// director-side half of the shim/director open-count reconciliation: the
// shim classifies every under-root open by which path it took, and these
// counts are what actually arrived at the director. This message is part of
// the gRPC control plane, not the ring wire protocol the injected DLL speaks
// — add fields here freely, but never renumber.
message StatsResp {
  uint64 cache_hits = 1;
  uint64 cache_misses = 2;
  uint64 cache_evicts = 3;
  uint64 cache_disk_hits = 4;
  uint64 cache_bytes_from_cache = 5;
  uint64 cache_bytes_from_source = 6;
  uint64 cache_ram_bytes = 7;
  uint32 sessions = 8;
  uint64 opens_ok = 9;
  uint64 opens_err = 10;
  repeated RejectedWrite rejected_writes = 11;
}
