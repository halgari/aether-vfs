[package]
name = "vfs-control"
version = "0.1.0"
edition = "2021"
publish = false
description = "Director control-plane gRPC contract + declarative config schema + client"

[lib]
name = "vfs_control"
path = "src/lib.rs"

[dependencies]
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"
