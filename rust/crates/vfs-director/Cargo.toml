[package]
name = "vfs-director"
version = "0.1.0"
edition = "2021"
publish = false
description = "Userspace FUSE host: mount backends, serve IPC, launch process with remapped I/O"

[lib]
name = "vfs_director"
path = "src/lib.rs"

[features]
default = ["zip"]
## Convenience `Session::mount_zip` (pulls vfs-zip).
zip = ["dep:vfs-zip"]

[dependencies]
vfs-env = { path = "../vfs-env" }
# `fold` only — the single source of truth for case-insensitive comparison,
# shared with the shim above the ring so mount-prefix matching and directory
# merging fold vpaths exactly the way the shim folded them.
vfs-core = { path = "../vfs-core" }
vfs-protocol = { path = "../vfs-protocol" }
vfs-provider = { path = "../vfs-provider" }
# `OverlayProvider` only — `Session::set_write_layer` composes the writable
# upper over the read-only mount graph here rather than leaving each host to
# rebuild copy-on-write out of sibling mounts (which cannot express it).
vfs-compose = { path = "../vfs-compose" }
vfs-ipc = { path = "../vfs-ipc" }
vfs-win = { path = "../vfs-win" }
vfs-inject = { path = "../vfs-inject" }
vfs-shim = { path = "../vfs-shim" }
vfs-zip = { path = "../vfs-zip", optional = true }

[target.'cfg(windows)'.dependencies]
# Window + process enumeration for the load benchmark (crates/vfs-director/src/bench.rs).
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
# Integrity tests compare the composed VFS against a native extract.
vfs-zip = { path = "../vfs-zip" }
vfs-shim = { path = "../vfs-shim" }
# `unicode_case_fold_across_the_ring` builds its vpaths with the *same*
# `RootMap` the shim uses, rather than lowercasing a string in the test — the
# whole point being that the two sides of the ring must fold identically.
vfs-redirect = { path = "../vfs-redirect" }
