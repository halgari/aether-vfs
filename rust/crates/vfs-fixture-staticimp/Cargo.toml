[package]
name = "vfs-fixture-staticimp"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "vfs-staticimp"
path = "src/main.rs"

# Deliberately no dependency on vfs-fixture-vproxy. A cdylib that is both a
# workspace member and a path dependency is built as two units that write the
# same `deps/vproxy.dll` (cargo#6313), which fails `--all-targets` with
# LNK1104. build.rs links the import lib by path instead, and the one harness
# that needs both — vfs-inject's `tests/common` — builds vproxy first in its
# own cargo invocation so the ordering is explicit rather than inferred.
