[package]
name = "vfs-inject"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
vfs-env.workspace = true
# The shim config codec (`shimcfg`), for the static-import rows.
vfs-protocol.workspace = true
vfs-core.workspace = true
vfs-pe.workspace = true
vfs-zip.workspace = true
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_Memory",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemServices",
  "Win32_System_Kernel",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemInformation",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
vfs-shim.workspace = true
# NOT a dev-dependency: a cdylib cannot be `use`d, so the edge only ordered the
# build — and `tests/common` already builds this package (plus the other PE
# fixtures) with a nested cargo at test runtime. As a dependency it was built a
# second time as its own artifact target, and both units wrote
# `deps/vfs_shim_dll.dll`, which is the cargo#6313 collision that made
# `--all-targets` unusable.
vfs-zip.workspace = true
# PE fixtures (payload, vproxy, staticimp) are built by build.rs via a nested
# `cargo build -p …` (cannot be normal deps: vfs-payload is no_std/panic=abort).

[[bin]]
name = "vfs-probe"
path = "src/bin/vfs-probe.rs"

[[bin]]
name = "vfs-acceptance"
path = "src/bin/vfs-acceptance.rs"

[[bin]]
name = "vfs-spawn-child"
path = "src/bin/vfs-spawn-child.rs"

[[bin]]
name = "vfs-fake-steam-helper"
path = "src/bin/vfs-fake-steam-helper.rs"

[[bin]]
name = "compare_map"
path = "src/bin/compare_map.rs"


[[bin]]
name = "list_mods"
path = "src/bin/list_mods.rs"

[lints]
workspace = true
