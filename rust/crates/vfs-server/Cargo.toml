[package]
name = "vfs-server"
version = "0.1.0"
edition = "2021"
description = "Benchmark-only ring server over vfs-core. Not the product path; see vfs-director."

[dependencies]
vfs-core = { path = "../vfs-core" }
vfs-shared = { path = "../vfs-shared", features = ["bridge"] }
vfs-ipc = { path = "../vfs-ipc" }
vfs-protocol = { path = "../vfs-protocol" }
