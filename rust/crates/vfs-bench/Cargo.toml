[package]
name = "vfs-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Benchmarks and live harnesses: ring-bench (ring round trips) and skyrim-live (a real Skyrim launch)"

[lib]
name = "vfs_bench"
path = "src/lib.rs"

[dependencies]
vfs-ipc.workspace = true
vfs-protocol.workspace = true
# `skyrim-live` and `launch_bench` read `stage` and `io_stats`; `ring-bench`
# drives the real Director and its serve workers, not a hand-written server:
# the worker loop and its notifier are half of what a round trip costs.
vfs-director.workspace = true
# `skyrim-live`: the embeddable session, the composition providers it mounts
# and the zip it launches from.
vfs-embed.workspace = true
vfs-compose.workspace = true
vfs-zip.workspace = true
vfs-env.workspace = true

# `ring-bench` is Unix-only: its Windows `main` just exits.
[target.'cfg(unix)'.dependencies]
vfs-provider.workspace = true
# `ring-bench names`: the shim's own final-path code and the name folding of
# its indexed base (`vfs-core`).
vfs-core.workspace = true

[target.'cfg(windows)'.dependencies]
# GetFinalPathNameByHandleW, for resolving the second (Documents\My Games)
# root's junction to its real target in `skyrim-live`
# (`resolve_second_root_target`).
vfs-win.workspace = true
# Window + process enumeration for the load benchmark (`launch_bench`).
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Diagnostics_ToolHelp",
] }

# Native on both ends: latency of one requester and throughput of several,
# under the shim's client discipline before and after `ring_lock` went.
[[bin]]
name = "ring-bench"
path = "src/bin/ring-bench.rs"

[[bin]]
name = "skyrim-live"
path = "src/bin/skyrim-live.rs"

[dev-dependencies]
vfs-testkit.workspace = true

[lints]
workspace = true
