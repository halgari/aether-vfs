[package]
name = "vfs-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The block store as pull-through cache and layer storage: catalog, RAM tier and Storage"

[dependencies]
vfs-block-store.workspace = true
vfs-provider.workspace = true
vfs-core.workspace = true
redb.workspace = true
uuid = { version = "1", features = ["v4"] }
blake3.workspace = true
tracing.workspace = true
tempfile = { workspace = true, optional = true }

[dev-dependencies]
vfs-testkit.workspace = true
vfs-provider = { workspace = true, features = ["conformance"] }
tempfile.workspace = true
vfs-compose.workspace = true

[features]
# Compress bulk writes on the GPU (`vfs_block_store::BulkCompression::Gpu`).
gpu-zstd = ["vfs-block-store/gpu-zstd"]
# Hooks other crates' tests use: `Storage::crash_on_drop_for_tests` and
# `snapshot_as_killed`.
test-hooks = ["dep:tempfile"]

[lints]
workspace = true
