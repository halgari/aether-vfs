[package]
name = "vfs-directord"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "VFS director daemon + reference CLI (the `vfs` binary)"

[lib]
name = "vfs_directord"
path = "src/lib.rs"

[[bin]]
name = "vfs"
path = "src/main.rs"

[[bin]]
name = "skyrim-live"
path = "src/bin/skyrim-live.rs"

[dependencies]
vfs-env = { path = "../vfs-env" }
vfs-control = { path = "../vfs-control" }
vfs-source = { path = "../vfs-source" }
# The embeddable API this daemon is one host over (design spec §4). Session
# lifecycle, roots, composition and launch all come from here.
vfs-embed = { path = "../vfs-embed" }
# Kernel-level pieces only the `skyrim-live` harness reaches for directly:
# `stage` (putting a launch image on real disk), `bench` and `io_stats`.
vfs-director = { path = "../vfs-director" }
vfs-compose = { path = "../vfs-compose" }
vfs-zip = { path = "../vfs-zip" }
vfs-protocol = { path = "../vfs-protocol" }
# GetFinalPathNameByHandleW, for resolving the second (Documents\My Games)
# root's junction to its real target in `skyrim-live` — see that binary's
# `resolve_second_root_target`.
vfs-win = { path = "../vfs-win" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "sync", "time", "io-util", "signal"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
prost = "0.14"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The daemon's log: `vfs-storage` and `vfs-block-store` report through
# `tracing` (durable-point failures, layer I/O errors, reconcile repairs).
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tempfile = "3"
toml = "0.8"
tonic = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
vfs-control = { path = "../vfs-control" }
