[package]
name = "vfs-directord"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "VFS director daemon + reference CLI (the `vfs` binary)"

[lib]
name = "vfs_directord"
path = "src/lib.rs"

[[bin]]
name = "vfs"
path = "src/main.rs"

[dependencies]
vfs-env.workspace = true
vfs-control.workspace = true
vfs-source.workspace = true
# The embeddable API this daemon is one host over (design spec §4). Session
# lifecycle, roots, composition and launch all come from here.
vfs-embed.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "process", "sync", "time", "io-util", "signal"] }
tokio-stream = { workspace = true, features = ["net"] }
tonic.workspace = true
prost.workspace = true
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# TEMPORARY: the one edge from the core into `addons/`, for the daemon's
# storage while it waits to be deleted (add-ons plan, Task 4). It goes with the
# daemon; nothing else under `rust/` may depend on `addons/`.
aether-storage = { path = "../../../addons/crates/aether-storage", default-features = false }
# The daemon's log: `aether-storage` and `aether-block-store` report through
# `tracing` (durable-point failures, layer I/O errors, reconcile repairs).
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }

[dev-dependencies]
vfs-testkit.workspace = true
# The daemon proper doesn't use stage/bench/io_stats; skyrim-live (now in
# `vfs-bench`) and these tests do.
vfs-director.workspace = true
vfs-protocol.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
tempfile.workspace = true
ctor = "0.2"
toml.workspace = true
tonic.workspace = true
tokio-stream = { workspace = true, features = ["net"] }
vfs-control.workspace = true

[lints]
workspace = true
