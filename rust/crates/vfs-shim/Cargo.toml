[package]
name = "vfs-shim"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
vfs-redirect = { path = "../vfs-redirect" }
# Pure NT layouts and decisions the hooks apply.
vfs-ntlayout = { path = "../vfs-ntlayout" }
vfs-shared = { path = "../vfs-shared" }
vfs-core = { path = "../vfs-core" }
vfs-protocol = { path = "../vfs-protocol" }
# `overlay_layer_dir` only — moved to vfs-provider (see overlay.rs) so the
# director can reach it without depending on this crate.
vfs-provider = { path = "../vfs-provider" }
vfs-ipc = { path = "../vfs-ipc" }
vfs-win = { path = "../vfs-win" }
# Dual-layer vehicle (reflective map + RIP-redirect + spin gate) for children.
vfs-env = { path = "../vfs-env" }
vfs-inject = { path = "../vfs-inject" }
# Names of the on-disk copies backing image sections.
vfs-pe = { path = "../vfs-pe" }
# `Lookup`, `Node` and `fold` for the registry client (`regclient.rs`).
vfs-registry = { path = "../vfs-registry" }
retour = { version = "0.3", default-features = false }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Memory",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Kernel",
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
# `tests/fakedirector` mounts `RwMemFixture`.
vfs-provider = { path = "../vfs-provider", features = ["conformance"] }
# `bridge` (test-only) provides `flatten` for building snapshot fixtures.
vfs-shared = { path = "../vfs-shared", features = ["bridge"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  # `tests/registry/regkeys*.rs`: scratch real keys, a restrictive DACL, the user SID.
  "Win32_System_Registry",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
  # `tests/registry/regnotify.rs`: ntdll calls looked up at run time.
  "Win32_System_LibraryLoader",
] }
# `tests/registry/regclient.rs`: the fake director answers the registry opcodes with the real
# `dispatch_director` over a real `RegistryHost`.
vfs-director = { path = "../vfs-director" }
