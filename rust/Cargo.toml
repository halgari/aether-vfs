[workspace]
resolver = "2"
members = [
  "crates/vfs-core",
  "crates/vfs-provider",
  "crates/vfs-env",
  "crates/vfs-shared",
  "crates/vfs-protocol",
  "crates/vfs-control",
  "crates/vfs-source",
  "crates/vfs-compose",
  "crates/vfs-cache",
  "crates/vfs-directord",
  "crates/vfs-ipc",
  "crates/vfs-inject",
  "crates/vfs-redirect",
  "crates/vfs-server",
  "crates/vfs-director",
  "crates/vfs-shim",
  "crates/vfs-shim-dll",
  "crates/vfs-win",
  "crates/vfs-zip",
  "crates/vfs-launch",
  "crates/vfs-fixture-read",
  "crates/vfs-fixture-write",
  "crates/vfs-fixture-writeset",
  "crates/vfs-fixture-writepath",
  "crates/vfs-fixture-escape",
  "crates/vfs-fixture-vproxy",
  "crates/vfs-fixture-staticimp",
  "crates/vfs-ring-harness",
  "crates/xtask-descriptor",
]
exclude = ["crates/vfs-payload"]

# `vfs-payload` is excluded from this workspace (it is #![no_std] with a custom
# panic_handler and must abort). Everything here unwinds so the library can
# catch panics at FFI boundaries instead of killing its host process.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
