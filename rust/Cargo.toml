[workspace]
resolver = "2"
members = [
  "crates/vfs-core",
  "crates/vfs-provider",
  # Pure PE byte parsing, extracted from vfs-inject so the director can stage
  # Windows executables on any host OS. No OS API and no dependencies: a PE is
  # a file format, not a platform. See
  # docs/superpowers/specs/2026-08-31-linux-fuse-proton-portability-design.md.
  "crates/vfs-pe",
  "crates/vfs-env",
  "crates/vfs-shared",
  "crates/vfs-protocol",
  "crates/vfs-control",
  "crates/vfs-source",
  "crates/vfs-compose",
  "crates/vfs-cache",
  "crates/vfs-directord",
  "crates/vfs-ipc",
  "crates/vfs-inject",
  "crates/vfs-redirect",
  "crates/vfs-server",
  "crates/vfs-director",
  "crates/vfs-embed",
  # The `aethervfs` N-API addon. A workspace member, not its own workspace, so
  # `cargo clippy --all-targets -- -D warnings` covers it: it depends on
  # `vfs-embed`, whose surface changes every task, and a binding outside the
  # workspace gates would rot silently until someone tried to ship it. Its
  # Rust build needs no Node — napi-sys resolves `napi_*` from the host process
  # at runtime — so membership costs the gates nothing.
  #
  # Two target-filter consequences, both deliberate: `cargo build --workspace
  # --tests` does **not** build the cdylib (`--tests` filters it, same as
  # `vfs-shim-dll`), so the addon needs an unfiltered `cargo build -p vfs-node`;
  # and `[lib] test = false` in its manifest keeps `cargo test --workspace` from
  # running a harness that cannot reach a single N-API function. See that
  # manifest for why.
  "crates/vfs-node",
  "crates/vfs-shim",
  "crates/vfs-shim-dll",
  "crates/vfs-win",
  # The Unix mirror of vfs-win: one crate per OS, each owning that OS's handles,
  # with the portable ring above both. Builds to an empty crate on Windows.
  "crates/vfs-unix",
  "crates/vfs-zip",
  "crates/vfs-launch",
  "crates/vfs-fixture-read",
  "crates/vfs-fixture-writepath",
  "crates/vfs-fixture-escape",
  "crates/vfs-fixture-prefs",
  "crates/vfs-fixture-vproxy",
  "crates/vfs-fixture-staticimp",
  "crates/vfs-ring-harness",
  "crates/xtask-descriptor",
]
exclude = ["crates/vfs-payload"]

# `vfs-payload` is excluded from this workspace (it is #![no_std] with a custom
# panic_handler and must abort). Everything here unwinds so the library can
# catch panics at FFI boundaries instead of killing its host process.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
