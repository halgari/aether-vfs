[workspace]
resolver = "2"
members = [
  "crates/vfs-core",
  "crates/vfs-provider",
  # Pure PE byte parsing, extracted from vfs-inject so the director can stage
  # Windows executables on any host OS. No OS API and no dependencies: a PE is
  # a file format, not a platform. See
  # docs/superpowers/specs/2026-08-31-linux-fuse-proton-portability-design.md.
  "crates/vfs-pe",
  "crates/vfs-env",
  "crates/vfs-protocol",
  "crates/vfs-control",
  "crates/vfs-source",
  "crates/vfs-compose",
  # Dev-only helpers shared by integration tests (stored-zip writer, artefact locator).
  "crates/vfs-testkit",
  # Registry overlay model (paths, copy-on-write tree). Portable: depends only on
  # vfs-core. See docs/superpowers/specs/2026-10-05-registry-overlay-design.md.
  "crates/vfs-registry",
  # Deduplicating, compressing block store (redb index + zstd packs),
  # imported with its history from aether-vfs-block-store. vfs-storage below
  # is its one consumer. Edition 2024, as it was upstream; GPL-3.0-only like
  # the rest.
  "crates/vfs-block-store",
  # The block store as pull-through cache and layer storage: one BlockStore,
  # a redb catalog beside it and a RAM tier of decompressed blocks: the
  # daemon's pull-through cache and its named write layers. See
  # docs/superpowers/specs/2026-09-29-vfs-storage-design.md.
  "crates/vfs-storage",
  "crates/vfs-directord",
  "crates/vfs-ipc",
  "crates/vfs-inject",
  # Pure NT byte layouts and decisions (directory records, dispositions, object names)
  # for the shim, split out so they build and test on any host.
  "crates/vfs-ntlayout",
  "crates/vfs-redirect",
  "crates/vfs-director",
  "crates/vfs-embed",
  "crates/vfs-shim",
  "crates/vfs-shim-dll",
  "crates/vfs-win",
  # The Unix mirror of vfs-win: one crate per OS, each owning that OS's handles,
  # with the portable ring above both. Builds to an empty crate on Windows.
  "crates/vfs-unix",
  # GE-Proton acquisition. Portable on purpose: extracting a Linux tarball on
  # Windows is useless but harmless, and keeping it portable means the URL,
  # digest, version-ordering and layout logic are covered by the Windows job,
  # which is the thicker of the two.
  "crates/vfs-proton",
  "crates/vfs-zip",
  "crates/vfs-fixture-read",
  "crates/vfs-fixture-writepath",
  "crates/vfs-fixture-escape",
  "crates/vfs-fixture-prefs",
  "crates/vfs-fixture-vproxy",
  # Steam API probe for the Proton launch path: loads a game's own
  # steam_api64.dll and reports what it sees of the Steam client.
  "crates/vfs-fixture-steam",
  # NVAPI probe for the Proton launch path: initialises NVAPI and loads NGX.
  "crates/vfs-fixture-nvapi",
  # Registry probe for the registry overlay's end-to-end test: a scripted Win32
  # registry sequence whose transcript must not change when the overlay is on.
  "crates/vfs-fixture-registry",
  "crates/vfs-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
# Floor the code needs: `File::try_lock` (1.89). CI runs `stable`.
rust-version = "1.89"
publish = false

# Unsafe is denied by default; a crate (or a test/bin root) that is FFI by
# nature says so with `#![allow(unsafe_code)]`, which makes the surface explicit.
# Not enabled yet because they need hundreds of edits in vfs-shim / vfs-win /
# the fixtures: rust `unsafe_op_in_unsafe_fn` and clippy
# `undocumented_unsafe_blocks`.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[workspace.dependencies]
# Internal crates.
vfs-block-store = { path = "crates/vfs-block-store" }
vfs-compose = { path = "crates/vfs-compose" }
vfs-control = { path = "crates/vfs-control" }
vfs-core = { path = "crates/vfs-core" }
vfs-director = { path = "crates/vfs-director" }
vfs-embed = { path = "crates/vfs-embed" }
vfs-env = { path = "crates/vfs-env" }
vfs-inject = { path = "crates/vfs-inject" }
vfs-ipc = { path = "crates/vfs-ipc" }
vfs-ntlayout = { path = "crates/vfs-ntlayout" }
vfs-pe = { path = "crates/vfs-pe" }
vfs-protocol = { path = "crates/vfs-protocol" }
vfs-provider = { path = "crates/vfs-provider" }
vfs-redirect = { path = "crates/vfs-redirect" }
vfs-registry = { path = "crates/vfs-registry" }
vfs-shim = { path = "crates/vfs-shim" }
vfs-source = { path = "crates/vfs-source" }
vfs-storage = { path = "crates/vfs-storage" }
vfs-testkit = { path = "crates/vfs-testkit" }
vfs-unix = { path = "crates/vfs-unix" }
vfs-win = { path = "crates/vfs-win" }
vfs-zip = { path = "crates/vfs-zip" }

# Shared external crates: one version spec each. Members add their own
# `features` / `optional` on top.
blake3 = "1.8"
clap = "4"
proptest = "1.11"
tempfile = "3.27"
serde = "1"
serde_json = "1"
thiserror = "2"
tokio = "1"
tokio-stream = "0.1"
toml = "0.8"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
tracing = "0.1"
protoc-bin-vendored = "3"
redb = "4.3"
windows-sys = "0.61"

# Everything here unwinds so the library can catch panics at FFI boundaries
# instead of killing its host process.
[profile.dev]
panic = "unwind"

# Third-party code (zstd, redb, blake3, ...) optimised even in debug builds, so
# debug tests and the debug Proton e2e run near release speed. Workspace crates
# stay at opt-level 0 for debuggability. Optimisation only, no behaviour change.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
panic = "unwind"
# Line tables only: Wine crash reports and core dumps symbolise, with no change
# to the generated code.
debug = "line-tables-only"
