[workspace]
resolver = "2"
members = [
  "crates/vfs-core",
  "crates/vfs-provider",
  # Pure PE byte parsing, extracted from vfs-inject so the director can stage
  # Windows executables on any host OS. No OS API and no dependencies: a PE is
  # a file format, not a platform. See
  # docs/superpowers/specs/2026-08-31-linux-fuse-proton-portability-design.md.
  "crates/vfs-pe",
  "crates/vfs-env",
  "crates/vfs-shared",
  "crates/vfs-protocol",
  "crates/vfs-control",
  "crates/vfs-source",
  "crates/vfs-compose",
  "crates/vfs-cache",
  # Deduplicating, compressing block store (redb index + zstd packs),
  # imported with its history from aether-vfs-block-store. It replaces the
  # vfs-cache layer in a later change; nothing depends on it yet. Edition
  # 2024 and MIT OR Apache-2.0, as it was upstream.
  "crates/vfs-block-store",
  # The block store as pull-through cache and layer storage: one BlockStore,
  # a redb catalog beside it and a RAM tier of decompressed blocks. Replaces
  # vfs-cache. See docs/superpowers/specs/2026-09-29-vfs-storage-design.md.
  "crates/vfs-storage",
  "crates/vfs-directord",
  "crates/vfs-ipc",
  "crates/vfs-inject",
  "crates/vfs-redirect",
  "crates/vfs-server",
  "crates/vfs-director",
  "crates/vfs-embed",
  "crates/vfs-shim",
  "crates/vfs-shim-dll",
  "crates/vfs-win",
  # The Unix mirror of vfs-win: one crate per OS, each owning that OS's handles,
  # with the portable ring above both. Builds to an empty crate on Windows.
  "crates/vfs-unix",
  # GE-Proton acquisition. Portable on purpose: extracting a Linux tarball on
  # Windows is useless but harmless, and keeping it portable means the URL,
  # digest, version-ordering and layout logic are covered by the Windows job,
  # which is the thicker of the two.
  "crates/vfs-proton",
  "crates/vfs-zip",
  "crates/vfs-launch",
  "crates/vfs-fixture-read",
  "crates/vfs-fixture-writepath",
  "crates/vfs-fixture-escape",
  "crates/vfs-fixture-prefs",
  "crates/vfs-fixture-vproxy",
  "crates/vfs-fixture-staticimp",
  "crates/vfs-ring-harness",
  "crates/xtask-descriptor",
]
exclude = ["crates/vfs-payload"]

# `vfs-payload` is excluded from this workspace (it is #![no_std] with a custom
# panic_handler and must abort). Everything here unwinds so the library can
# catch panics at FFI boundaries instead of killing its host process.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
