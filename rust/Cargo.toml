[workspace]
resolver = "2"
members = [
  "crates/vfs-core",
  "crates/vfs-env",
  "crates/vfs-shared",
  "crates/vfs-protocol",
  "crates/vfs-control",
  "crates/vfs-source",
  "crates/vfs-compose",
  "crates/vfs-cache",
  "crates/vfs-directord",
  "crates/vfs-ipc",
  "crates/vfs-inject",
  "crates/vfs-payload",
  "crates/vfs-redirect",
  "crates/vfs-server",
  "crates/vfs-director",
  "crates/vfs-shim",
  "crates/vfs-shim-dll",
  "crates/vfs-win",
  "crates/vfs-zip",
  "crates/vfs-launch",
  "crates/vfs-fixture-read",
  "crates/vfs-fixture-write",
  "crates/vfs-fixture-writeset",
  "crates/vfs-fixture-vproxy",
  "crates/vfs-fixture-staticimp",
  "crates/vfs-ring-harness",
  "crates/xtask-descriptor",
]

# Required by crates/vfs-payload (#![no_std] + custom panic_handler; cannot
# unwind). Cargo does not allow per-package `panic` in workspace package
# profiles, so this applies workspace-wide. That is intentional and safe for
# the rest of the tree (no catch_unwind-based tests rely on unwind).
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
