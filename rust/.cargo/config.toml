[env]
# `libudis86-sys` (reached through `retour`, i.e. the shim) forces `string.h`
# with the GCC spelling `-includestring.h`. MSVC's cl.exe never needed it — it
# accepts the implicit `memset` declaration — but clang-cl, which is what
# `cargo xwin` compiles C with when building the shim from Linux, ignores the
# unknown flag and then rejects the implicit declaration as an error.
# `/FI` is the forced-include spelling both cl.exe and clang-cl understand, so
# this is a no-op on a Windows host and the fix on a Linux one.
#
# The hyphenated name is deliberate: cargo-xwin sets the underscored
# `CFLAGS_x86_64_pc_windows_msvc` itself, and cc-rs reads both.
"CFLAGS_x86_64-pc-windows-msvc" = "/FIstring.h"
